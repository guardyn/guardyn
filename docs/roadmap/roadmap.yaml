# Machine source of truth for the roadmap.
#
# This file drives GitHub Issues and the project board (PR-18). ROADMAP.md is the
# narrative view of it, and STATE.md is generated telemetry. When any of the three
# disagree, this file wins.
#
# `status` is the DESIRED state and is written here first. roadmap-sync then moves GitHub to
# match it: `done` closes the issue, anything else reopens it.
#
# Do not copy status back from the live issue list. That inverts the direction of truth, and a
# step left `todo` after its work merged will reopen a correctly-closed issue on the next push
# to main - which is exactly what happened to twenty-one steps before #228.
#
# A step's status therefore changes in the SAME pull request that does its work, never in a
# later reconciliation pass.
---
project_number: 3
project_url: https://github.com/orgs/guardyn/projects/3
charter: implementation_plan.md

# P-1 is resolved: the ambient gh credential now carries the project scope, obtained with
# `gh auth refresh -h github.com -s project`. The fine-grained PAT the organization rejects
# is out of the picture, and the OAuth token that replaced it reads and writes the board.
#
# Still outstanding: GUARDYN_PROJECT_TOKEN as a repository *secret*, which is what
# roadmap-sync.yml needs to reconcile the board from CI rather than from a developer's
# machine. Without it the workflow skips the board half and exits 0.
project_sync_enabled: true

invariants:
  - {id: I-1, name: Zero-Knowledge,   met: partial, note: "rate_limit.rs logs a raw IP; span fields are not redacted"}
  - {id: I-2, name: Always-On E2EE,   met: partial, closed_by: [PR-30, PR-31a, PR-31b, PR-32a, PR-32b, PR-32c, PR-75, PR-76, PR-77, PR-78, PR-79, PR-80, PR-80b, PR-81, PR-81b, PR-81c], note: "no switch can disable encryption - E2EE-FLAG passes and rules-verify enforces it - no client path transmits plaintext, and client-desktop one-to-one messaging now runs over the encrypted path. Remaining: mobile groups refuse for want of MLS"}
  - {id: I-3, name: Post-Quantum,     met: false,   closed_by: [PR-36, PR-37, PR-38, PR-39, PR-40]}
  - {id: I-4, name: Data Sovereignty, met: partial, note: "envoy/ingress.yaml hardcodes a domain"}

# `status` is the gate's own state, recorded here rather than inferred from its step.
# A gate step reaching `done` means its WORK landed; it does not mean the user approved the
# gate, and AGENTS.md 2.5 makes that approval the thing that lets the next phase begin. Only
# one of those two facts is derivable from a step, so the other needs somewhere to live.
#
#   not-reached - the gate's step has not landed
#   reached     - the step landed, approval outstanding
#   passed      - the user approved
