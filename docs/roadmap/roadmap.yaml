  # includeSelectors: true and renders the label into the IMMUTABLE matchLabels of the envoy
  # Deployment and both TiKV StatefulSets. Renaming means delete-and-recreate of the TiKV control
  # plane - the metadata and auth store - for a string nothing reads.
  #
  # And it would silently disarm a health gate: fix-cluster-after-restart.sh:141 waits on
  # `-l guardyn.io/stage=poc`, which against pods still carrying the old label matches nothing,
  # and `|| log_warn` swallows the error. Tie this to the next teardown + kube-create, where the
