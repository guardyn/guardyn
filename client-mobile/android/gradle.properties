# Flutter's default. The previous -Xmx8G/-XX:MaxMetaspaceSize=4G was sized for a workstation and
# is not safe now that mobile-verify runs Gradle on a shared runner. Lowering it also surfaced
# the Jetifier problem below, which the oversized heap had been absorbing rather than fixing.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Was `true`. Jetifier rewrites legacy `android.support.*` artifacts, and nothing in this
# dependency graph is one - but it still ran on every artifact, and at a 4G heap it OOMs
# transforming the Flutter embedding jar (`JetifyTransform ... Java heap space`). It is
# deprecated under AGP 8 and removed in AGP 9, so turning it off is both the fix and the
# direction of travel. Verified: `flutter build apk --debug` succeeds with it off.
android.enableJetifier=false

# Gradle's own default. This was `none`, which suppressed every deprecation warning - including
# the ones that announce the next toolchain floor. Silencing them is how #367 stayed invisible
# until someone tried to launch the app; `summary` keeps the output short but keeps the signal.
org.gradle.warning.mode=summary

# Written automatically by the Flutter migrator on the first build under Flutter 3.47.3.
# Committed rather than left to regenerate, so a build does not dirty every working tree.
# Both are AGP 9 opt-outs; `newDsl` in particular is what keeps app/build.gradle.kts applying.
android.builtInKotlin=false
android.newDsl=false
