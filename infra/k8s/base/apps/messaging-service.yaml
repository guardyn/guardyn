apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging-service
  namespace: apps
  labels:
    app: messaging-service
    guardyn.io/stage: poc
spec:
  replicas: 3
  selector:
    matchLabels:
      app: messaging-service
  template:
    metadata:
      labels:
        app: messaging-service
        guardyn.io/stage: poc
    spec:
      containers:
      - name: messaging-service
        image: guardyn-messaging-service:latest
        imagePullPolicy: Never  # Use locally imported image
        ports:
        - containerPort: 50052
          name: grpc
          protocol: TCP
        - containerPort: 8081
          name: websocket
          protocol: TCP
        env:
        - name: GUARDYN_SERVICE_NAME
          value: "messaging-service"
        - name: GUARDYN_HOST
          value: "0.0.0.0"
        - name: GUARDYN_PORT
          value: "50052"
        - name: GUARDYN_DATABASE__TIKV_PD_ENDPOINTS
          value: "pd.data.svc.cluster.local:2379"
        - name: GUARDYN_DATABASE__SCYLLADB_NODES
          value: "guardyn-scylla-client.data.svc.cluster.local:9042"
        - name: SCYLLADB_ENDPOINTS
          value: "guardyn-scylla-client.data.svc.cluster.local:9042"
        # ScyllaDB Consistency Configuration
        # For local dev with single node: use "one"
        # For production with 3+ nodes: use "local_quorum"
        - name: SCYLLA_CONSISTENCY
          value: "one"
        - name: SCYLLA_REPLICATION_FACTOR
          value: "1"
        # KafkaConfig::from_env reads REDPANDA_BROKERS or KAFKA_BROKERS; the GUARDYN_ config
        # loader has no redpanda_brokers field, so the prefixed name was never read.
        - name: REDPANDA_BROKERS
          value: "redpanda.messaging.svc.cluster.local:9092"
        - name: GUARDYN_OBSERVABILITY__OTLP_ENDPOINT
          value: "http://tempo.observability.svc.cluster.local:4317"
        - name: GUARDYN_OBSERVABILITY__LOG_LEVEL
          value: "info"
        - name: RUST_LOG
          value: "info,guardyn_messaging_service=debug"
        # No cryptographic feature flags. The ratchet and MLS run on the clients; this
        # service relays opaque bytes and holds no key material, so it has nothing to
        # configure - see docs/adr/ADR-0010-pure-relay-server.md.
        # Service Endpoints
        - name: AUTH_SERVICE_ENDPOINT
          value: "http://auth-service.apps.svc.cluster.local:50051"
        # WebSocket Configuration
        - name: ENABLE_WEBSOCKET
          value: "true"
        - name: WEBSOCKET_PORT
          value: "8081"
        # JWT authentication secret (GUARDYN_ prefix for consistency)
        - name: GUARDYN_AUTH__JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: guardyn-backend-secrets
              key: jwt-secret
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          tcpSocket:
            port: 50052
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 50052
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: tls-certs
          mountPath: /etc/ssl/certs/guardyn
          readOnly: true
      volumes:
      - name: tls-certs
        secret:
          secretName: guardyn-backend-tls
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: messaging-service
  namespace: apps
  labels:
    app: messaging-service
    guardyn.io/stage: poc
spec:
  selector:
    app: messaging-service
  ports:
  - name: grpc
    port: 50052
    targetPort: 50052
    protocol: TCP
  - name: websocket
    port: 8081
    targetPort: 8081
    protocol: TCP
  type: ClusterIP
